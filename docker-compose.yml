services:
  miho:
    build: .
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "8000:8000"
      # Set MIHO_PROXY_BIND=0.0.0.0 to allow remote HTTP(S) proxy clients.
      - "${MIHO_PROXY_BIND:-127.0.0.1}:7890:7890"
      - "${MIHO_PROXY_BIND:-127.0.0.1}:7892:7892"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MIHO_HTTP_PROXY_URL: ${MIHO_HTTP_PROXY_URL:-http://localhost:7890}
      MIHO_HTTPS_PROXY_URL: ${MIHO_HTTPS_PROXY_URL:-https://localhost:7892}
    volumes:
      - miho-data:/data
volumes:
  miho-data:
