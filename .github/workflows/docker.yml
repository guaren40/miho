name: ARM64 Docker verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native ARM64
            runner: ubuntu-24.04-arm
            browser: '0'
          - name: Zeabur-style default build and browser
            runner: ubuntu-24.04
            browser: '1'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: docker/setup-qemu-action@v3
        if: matrix.browser == '1'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      # Deliberately omit --platform here: Zeabur's shared builder reports amd64.
      # The Dockerfile must still produce an ARM64 image, on either worker type.
      - name: Build ARM64 root filesystem with the worker's default target
        run: docker buildx build --load -t miho:test .
      - name: Install browser
        if: matrix.browser == '1'
        run: |
          pip install playwright==1.64.0
          playwright install --with-deps chromium
      - name: Verify the real container and proxy protocols
        env:
          BROWSER_TEST: ${{ matrix.browser }}
        run: python scripts/smoke_test.py
      - name: Save browser screenshot
        if: always() && matrix.browser == '1'
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: test-results/
          if-no-files-found: ignore
